document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3de15e9b-e123-4c16-b877-f361b029216b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* FounderNexus webfonts — Plus Jakarta Sans (primary), Roboto (legacy/email/product) */\n\n@font-face {\n  font-family: \"Plus Jakarta Sans\";\n  src: url(\"3b849060-40be-4d39-a453-6674ec096c79\") format(\"woff2\");\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Plus Jakarta Sans\";\n  src: url(\"294695f8-2250-45e1-899a-0b4712a549fc\") format(\"woff2\");\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Plus Jakarta Sans\";\n  src: url(\"784a2647-9d69-4d1c-bbab-beba555ef693\") format(\"woff2\");\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Plus Jakarta Sans\";\n  src: url(\"83cc2334-ab5e-4df2-a0ad-8370370dafba\") format(\"woff2\");\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Roboto\";\n  src: url(\"f9c8fde8-3363-44eb-a360-a2173545ce74\") format(\"woff2\");\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Roboto\";\n  src: url(\"60570cba-db1e-46df-82da-adefb6c2ec4f\") format(\"woff2\");\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Roboto\";\n  src: url(\"9b6e4de1-2f56-4d31-b478-587393eea04d\") format(\"woff2\");\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n}\n<\u002Fstyle>\n<style>/* FounderNexus — Color tokens\n   Derived from the FounderNexus master .fig + distilled brand tokens.\n   Brand feel: white surfaces, deep navy text, decisive blue actions,\n   pale-blue supporting panels, restrained gray borders. */\n\n:root {\n  /* ---- Brand: navy (ink) ---- */\n  --navy-900: #01052A;   /* deep navy — primary text / headings */\n  --navy-800: #040A43;   /* action-deep navy */\n  --navy-700: #061B2C;   /* rich navy — dark surfaces, event hero */\n  --navy-600: #0C2438;\n  --ink-900:  #202020;   /* near black */\n  --black:    #000000;\n\n  /* ---- Brand: blue (action) ---- */\n  --blue-700: #0059A8;\n  --blue-600: #0072BA;   /* secondary blue */\n  --blue-500: #007BE4;   /* PRIMARY action blue */\n  --blue-450: #1E88E5;\n  --blue-400: #2196F3;\n  --blue-action: #215BE3;/* action blue variant (links/focus) */\n  --blue-300: #66B2F0;\n  --blue-200: #A6D2F7;\n  --blue-100: #D3EAFD;   /* soft blue — chips / selected surface */\n  --blue-50:  #F1F8FF;   /* pale blue — emphasis panels */\n\n  /* ---- Neutrals (gray) ---- */\n  --white:    #FFFFFF;\n  --gray-25:  #FCFCFD;\n  --gray-50:  #F9F9F9;   /* light page surface */\n  --gray-100: #F1F5F9;   /* light gray surface */\n  --gray-200: #E2E8F0;\n  --gray-300: #D0D5DD;   /* border gray 2 */\n  --gray-350: #D3D6DA;   /* border gray */\n  --gray-400: #9EADBA;   /* secondary muted text */\n  --gray-450: #929497;   /* neutral mid gray — deck captions, citations, slide numbers */\n  --gray-500: #64748B;\n  --gray-600: #56646F;   /* muted text */\n  --gray-700: #475467;\n  --gray-800: #334155;\n\n  /* ---- Semantic status ---- */\n  --green-500: #1F9D55;\n  --green-50:  #E7F6EE;\n  --red-500:   #D92D20;\n  --red-50:    #FEF3F2;\n  --amber-500: #F59E0B;\n  --amber-50:  #FEF6E0;\n  --yellow:    #FFCC00;   /* product-UI status label only — never dominant */\n\n  /* ===================================================================\n     SEMANTIC ALIASES — prefer these in components\n     =================================================================== */\n\n  /* Text */\n  --text-primary:   var(--navy-900);\n  --text-secondary: var(--gray-600);\n  --text-muted:     var(--gray-400);\n  --text-on-dark:   var(--white);\n  --text-link:      var(--blue-500);\n  --text-brand:     var(--blue-500);\n\n  /* Surfaces */\n  --surface-page:    var(--gray-50);\n  --surface-card:    var(--white);\n  --surface-raised:  var(--white);\n  --surface-subtle:  var(--gray-100);\n  --surface-accent:  var(--blue-50);   /* pale blue emphasis panel */\n  --surface-chip:    var(--blue-100);  /* soft blue chip */\n  --surface-dark:    var(--navy-700);  /* event hero / dark blocks */\n  --surface-darkest: var(--navy-900);\n\n  /* Borders */\n  --border-subtle:  var(--gray-200);\n  --border-default: var(--gray-350);\n  --border-strong:  var(--gray-300);\n  --border-focus:   var(--blue-500);\n\n  /* Actions */\n  --action-primary:        var(--blue-500);\n  --action-primary-hover:  var(--blue-600);\n  --action-primary-active: var(--blue-700);\n  --action-disabled:       var(--gray-200);\n  --action-disabled-text:  var(--gray-400);\n\n  /* Presentation / keynote (slides)\n     Decks run a heavier, higher-contrast register than the web UI: blue-600 is\n     the full-bleed statement field (not a hover state), and captions use the\n     neutral gray-450 rather than the blue-tinted slate grays. */\n  --deck-headline:       var(--navy-900);  /* headlines on white slides — navy is the ink */\n  --deck-field:          var(--blue-600);  /* statement field: opportunity / upside */\n  --deck-field-deep:     var(--navy-700);  /* statement field: risk / consequence */\n  --deck-accent:         var(--blue-600);  /* eyebrows, numeral discs, data panels, CTAs */\n  --deck-ink:            var(--gray-800);  /* body copy on white slides */\n  --deck-muted:          var(--gray-450);  /* captions, citations, slide numbers */\n  --deck-on-field:       var(--white);\n  --deck-on-field-muted: var(--blue-100);  /* secondary copy on a blue field */\n  --deck-panel:          var(--gray-100);  /* card / grid panel fill */\n  --deck-panel-border:   var(--gray-200);\n\n  /* Status (semantic) */\n  --status-success: var(--green-500);\n  --status-success-bg: var(--green-50);\n  --status-error:   var(--red-500);\n  --status-error-bg: var(--red-50);\n  --status-warning: var(--amber-500);\n  --status-warning-bg: var(--amber-50);\n  --status-info:    var(--blue-500);\n  --status-info-bg: var(--blue-50);\n}\n<\u002Fstyle>\n<style>/* FounderNexus — Typography tokens\n   Primary: Plus Jakarta Sans. Secondary (legacy email / product UI): Roboto. */\n\n:root {\n  /* Families */\n  --font-sans: \"Plus Jakarta Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n  --font-product: \"Roboto\", \"Plus Jakarta Sans\", -apple-system, sans-serif;\n  --font-display: \"Plus Jakarta Sans\", -apple-system, sans-serif;\n\n  /* Weights */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n\n  /* Type scale (px) — found in source */\n  --fs-xs: 12px;     /* small labels / meta */\n  --fs-sm: 14px;     /* secondary body, controls */\n  --fs-base: 16px;   /* body default */\n  --fs-md: 18px;     /* lead body */\n  --fs-lg: 20px;     /* small section heading */\n  --fs-xl: 24px;     /* section heading */\n  --fs-2xl: 30px;    /* large section heading */\n  --fs-3xl: 40px;    /* hero / page title */\n  --fs-4xl: 50px;    /* large hero */\n  --fs-5xl: 80px;    /* display hero (desktop) */\n\n  /* Presentation scale (px) — for 1920×1080 slides ONLY, never web UI.\n     Derived from the Trust/GTM keynote authored at 960×540 (×2). */\n  --fs-deck-eyebrow: 24px;   /* uppercase kicker + slide number */\n  --fs-deck-note: 28px;      /* citation / footnote */\n  --fs-deck-body-sm: 30px;   /* card body */\n  --fs-deck-body: 38px;      /* slide body copy */\n  --fs-deck-lead: 48px;      /* lead-in / list statement */\n  --fs-deck-h2: 66px;        /* content-slide headline */\n  --fs-deck-h1: 88px;        /* section statement headline */\n  --fs-deck-display: 104px;  /* title + closing statement */\n  --fs-deck-stat: 132px;     /* single big figure */\n\n  /* Line heights */\n  --lh-tight: 1. ound: active ? \"var(--blue-500)\" : \"var(--white)\",\n      border: active ? \"3.5px solid var(--white)\" : \"1.5px solid var(--gray-300)\",\n      boxShadow: active ? \"0 0 0 1.5px var(--blue-500)\" : \"none\"\n    };\n  }\n\n  opts(field, list, small) {\n    return list.map(o => ({\n      key: o[0], label: o[1],\n      style: this.pillStyle(this.state[field] === o[0], small),\n      dot: this.dotStyle(this.state[field] === o[0]),\n      onClick: this.pick(field, o[0])\n    }));\n  }\n\n  contactProgress() {\n    const s = this.state;\n    const f = [s.email.includes(\"@\"), s.mobile.length > 6, s.consent];\n    return f.filter(Boolean).length / f.length;\n  }\n\n  profileProgress() {\n    const s = this.state;\n    const f = [s.photo, s.first, s.last, s.country, s.region, s.city, s.linkedin];\n    return f.filter(Boolean).length / f.length;\n  }\n\n  experienceProgress() {\n    const s = this.state;\n    if (s.founder === null) return 0;\n    let need = [s.founder];\n    if (s.founder === \"no\") need.push(s.role, s.interest);\n    else {\n      need.push(s.years3, s.build, s.raised, s.multi);\n      if (s.build === \"building\") need.push(s.venture, s.currentArr);\n      if (s.multi === \"yes\") need.push(s.highestArr);\n    }\n    return need.filter(Boolean).length / need.length;\n  }\n\n  stage() {\n    const s = this.state;\n    const key = s.build === \"building\" ? s.currentArr : s.highestArr || s.currentArr;\n    return {\n      s1: [\"Stage 1\", \"$0–2M ARR · Pre-seed / Seed\"],\n      s2: [\"Stage 2\", \"$2–10M ARR · Series A\"],\n      s3: [\"Stage 3\", \"$10–50M ARR · Series B/C\"],\n      s4: [\"Stage 4\", \"$50M+ ARR · Series D+\"]\n    }[key] || [\"Stage 1\", \"$0–2M ARR · Pre-seed / Seed\"];\n  }\n\n  renderVals() {\n    const s = this.state;\n    const p = this.props;\n    const meterStyle = p.meterStyle ?? \"segmented\";\n    const prospect = s.status === \"prospect\";\n\n    const viewTabs = [\n      { value: \"flow\", label: \"Onboarding\" },\n      { value: \"profile\", label: \"Your profile\" },\n      { value: \"email1\", label: \"Approval email\" },\n      { value: \"email2\", label: \"Invitation email\" }\n    ];\n\n    const prog = [this.contactProgress(), this.profileProgress(), this.experienceProgress()];\n    const labels = [\"Contact\", \"Profile\", \"Experience\"];\n    const meter = labels.map((label, i) => {\n      const idx = i + 1;\n      const done = s.step > idx;\n      const active = s.step === idx;\n      const pct = done ? 100 : active ? Math.max(6, Math.round(prog[i] * 100)) : 0;\n      return {\n        key: label,\n        value: pct,\n        label: meterStyle === \"segmented\" ? label : \"0\" + idx + \" · \" + label,\n        wrapStyle: {\n          flex: \"1 1 0%\", minWidth: 0,\n          opacity: done || active ? 1 : .5,\n          transition: \"opacity var(--dur-base)\"\n        }\n      };\n    });\n\n    const totalPct = (prog[0] + prog[1] + prog[2]) / 3;\n    const minsLeft = Math.max(1, Math.ceil((1 - totalPct) * 4));\n\n    const codeCells = [0,1,2,3,4,5].map(i => ({\n      key: i, value: s.code[i] || \"\", ref: this.codeRefs[i],\n      onChange: (e) => {\n        const v = e.target.value.replace(/\\D/g, \"\").slice(-1);\n        const arr = s.code.padEnd(6, \" \").split(\"\");\n        arr[i] = v || \" \";\n        this.setState({ code: arr.join(\"\").replace(/\\s+$/, \"\") });\n        if (v && i < 5) this.codeRefs[i + 1].current?.focus();\n      },\n      onKeyDown: (e) => {\n        if (e.key === \"Backspace\" && !s.code[i] && i > 0) this.codeRefs[i - 1].current?.focus();\n      },\n      style: {\n        width: 56, height: 60, textAlign: \"center\", boxSizing: \"border-box\",\n        border: \"1.5px solid \" + (s.code[i] ? \"var(--border-focus)\" : \"var(--border-default)\"),\n        borderRadius: \"var(--radius-md)\", background: \"var(--white)\", outline: \"none\",\n        font: \"var(--fw-bold) var(--fs-2xl)/1 var(--font-sans)\", color: \"var(--navy-900)\",\n        transition: \"border-color var(--dur-fast)\"\n      }\n    }));\n\n    const codeReady = s.code.replace(/\\s/g, \"\").length === 6;\n\n    const journeyDefs = [\n      [\"01\", \"Apply\", \"Done.\", 1],\n      [\"02\", \"Application review\", \"We're reading it.\", 2],\n      [\"03\", \"Meet your Nexus Partner\", \"They choose your room.\", 3],\n      [\"04\", \"Attend sessions\", \"Stage-matched, no cap.\", 4],\n      [\"05\", \"Peer evaluation\", \"The room decides.\", 5],\n      [\"06\", \"Invitation extended\", \"Offered, never sold.\", 6]\n    ];\n    const current = prospect ? 3 : 2;\n    const groupDefs = [[1, \"Getting into the room\", 4], [2, \"Earning the seat\", 2]];\n    const journey = journeyDefs.map(j => {\n      const done = j[3] < current;\n      const now = j[3] === current;\n      return {\n        key: j[0], num: j[0], done, pending: !done, title: j[1], note: j[2],\n        group: j[3] <= 4 ? 1 : 2,\n        lastInGroup: j[3] === 4 || j[3] === journeyDefs.length,\n        trackStyle: {\n          position: \"absolute\", top: 13, left: \"22px\", right: \"-8px\", height: 2,\n          display: (j[3] === 4 || j[3] === journeyDefs.length) ? \"none\" : \"block\",\n          background: done ? \"var(--navy-900)\" : \"var(--gray-200)\"\n        },\n        discStyle: {\n          position: \"relative\", width: 28, height: 28, borderRadius: \"var(--radius-pill)\",\n          display: \"flex\", alignItems: \"center\", justifyContent: \"center\",\n          marginBottom: \"var(--space-4)\",\n          background: done ? \"var(--navy-900)\" : now ? \"var(--action-primary)\" : \"var(--white)\",\n          border: done || now ? \"2px solid var(--white)\" : \"2px solid var(--gray-200)\",\n          boxShadow: now ? \"0 0 0 4px var(--surface-accent)\" : \"none\",\n          color: done || now ? \"var(--white)\" : \"var(--text-muted)\",\n          font: \"var(--fw-bold) var(--fs-xs)/1 var(--font-sans)\"\n        },\n        titleStyle: {\n          font: ot a mixer. Rooms of founders inside your ARR band, working the same class of decision. Register for as many as you want.\", last: false },\n      { key: \"g2\", icon: \"clock\", title: \"A 48-hour follow-up\", note: \"We close the loop after the room, so the conversation becomes a decision rather than a memory.\", last: false },\n      { key: \"g3\", icon: \"users\", title: \"Peer evaluation\", note: \"The founders in the room decide whether an invitation follows. Membership is offered, not sold.\", last: true }\n    ].map(g => ({\n      ...g,\n      rowStyle: {\n        display: \"flex\", gap: \"var(--space-4)\", padding: \"var(--space-5) var(--space-6)\",\n        borderBottom: g.last ? \"none\" : \"1px solid var(--border-subtle)\"\n      }\n    }));\n\n    const memberBenefits = [\n      { key: \"m1\", title: \"Every session, not one\", note: \"Full access to stage-matched rooms, online and in person.\" },\n      { key: \"m2\", title: \"VC Fast-Pass\", note: \"A routed introduction when you're raising, not a cold list.\" },\n      { key: \"m3\", title: \"Founder Nomination System\", note: \"You decide who else earns a seat. The room stays worth sitting in.\" },\n      { key: \"m4\", title: \"48-hour follow-up\", note: \"Every room closes its loop, so decisions actually get made.\" }\n    ];\n\n    const st = this.stage();\n    const stageKnown = !!(s.build === \"building\" ? s.currentArr : s.highestArr || s.currentArr);\n    const emailValid = s.email.includes(\"@\");\n    const emailKnown = this.knownEmails.includes(s.email.trim().toLowerCase());\n    const companyFields = [s.companyName, s.website, s.title, s.companyPhone, s.companyAddress];\n    const completionPct = Math.round(((6 + companyFields.filter(Boolean).length) / 11) * 100);\n\n    return {\n      viewTabs, view: s.view, setView: (v) => this.setState({ view: v }),\n      isFlow: s.view === \"flow\", isProfile: s.view === \"profile\",\n      isEmail1: s.view === \"email1\", isEmail2: s.view === \"email2\",\n      inWizard: s.view === \"flow\" && s.step >= 1 && s.step <= 3 && s.step !== 1.5,\n      showBack: s.view === \"flow\" && s.step <= 3,\n      backLabel: s.step === 0 ? \"Back to main page\" : \"Go back\",\n      atGate: s.step === 0, atContact: s.step === 1, atVerify: s.step === 1.5,\n      atProfile: s.step === 2, atExperience: s.step === 3, atDone: s.step === 4,\n\n      meter, stepCounter: \"Step \" + Math.min(Math.floor(s.step), 3) + \" of 3\",\n      showTime: (p.showTimeEstimate ?? true) && s.step >= 1 && s.step <= 3 && s.step !== 1.5,\n      timeLeft: \"About \" + minsLeft + \" minute\" + (minsLeft === 1 ? \"\" : \"s\") + \" left\",\n\n      email: s.email, onEmail: this.set(\"email\"),\n      emailKnown, emailIsNew: !emailKnown,\n      dialCode: s.dialCode, onDialCode: this.set(\"dialCode\"),\n      mobile: s.mobile, onMobile: this.set(\"mobile\"),\n      consent: s.consent, setConsent: (v) => this.setState({ consent: v }),\n\n      first: s.first, last: s.last,\n      country: s.country, region: s.region, city: s.city, postal: s.postal, linkedin: s.linkedin,\n      onFirst: this.set(\"first\"), onLast: this.set(\"last\"),\n      onCountry: this.set(\"country\"), onRegion: this.set(\"region\"),\n      onCity: this.set(\"city\"), onPostal: this.set(\"postal\"), onLinkedin: this.set(\"linkedin\"),\n      photo: s.photo, fileRef: this.fileRef,\n      pickPhoto: () => this.fileRef.current?.click(),\n      onPhoto: (e) => {\n        const f = e.target.files && e.target.files[0];\n        if (!f) return;\n        const r = new FileReader();\n        r.onload = () => this.setState({ photo: r.result });\n        r.readAsDataURL(f);\n      },\n      photoCta: s.photo ? \"Replace\" : \"Upload photo\",\n      photoBadge: s.photo ? \"Added\" : \"Required\",\n      photoTone: s.photo ? \"success\" : \"warning\",\n\n      qFounder: this.opts(\"founder\", [[\"yes\", \"Yes\"], [\"no\", \"No\"]]),\n      qYears: this.opts(\"years3\", [[\"yes\", \"Yes\"], [\"no\", \"No\"]], true),\n      qBuild: this.opts(\"build\", [[\"building\", \"Building\"], [\"looking\", \"Looking\"]]),\n      qVenture: this.opts(\"venture\", [[\"yes\", \"Yes\"], [\"no\", \"No\"]], true),\n      qRaised: this.opts(\"raised\", [[\"yes\", \"Yes\"], [\"no\", \"No\"]]),\n      qMulti: this.opts(\"multi\", [[\"yes\", \"Yes\"], [\"no\", \"No\"]]),\n      qInterest: this.opts(\"interest\", [\n        [\"Founder\", \"Founder\"], [\"Aspiring founder\", \"Aspiring founder\"], [\"Investor\", \"Investor\"],\n        [\"Service provider\", \"Service provider\"], [\"Research or writing\", \"Research or writing\"],\n        [\"Speaker\", \"Speaker\"], [\"Student\", \"Student\"], [\"Media\", \"Media\"], [\"Other\", \"Other\"]\n      ], true),\n      founderYes: s.founder === \"yes\", founderNo: s.founder === \"no\",\n      isBuilding: s.build === \"building\", multiYes: s.multi === \"yes\",\n      role: s.role, onRole: this.set(\"role\"),\n      currentArr: s.currentArr, onCurrentArr: this.set(\"currentArr\"),\n      highestArr: s.highestArr, onHighestArr: this.set(\"highestArr\"),\n\n      codeCells, codeIncomplete: !codeReady,\n      codeHint: codeReady ? \"Code accepted.\" : \"Didn't get it? We can resend in 30 seconds.\",\n      emailShown: emailValid ? s.email : \"your email\",\n\n      doneSub: \"A Nexus Partner is reading your application now. You'll hear back shortly.\",\n      stageTitle: st[0],\n      stageBand: st[1],\n      stageNote: stageKnown\n        ? \"Founders inside your band, working the same class of decision you're facing.\"\n        : \"Our read from your answers. Your Nexus Partner confirms it on the call.\",\n      journey,\n\n      gatePoints: [\n        { key: \"g1\", icon: \"clock\", label: \"Four minutes to complete.\" },\n        { key: \"g2\", icon: \"users\", label: \"A person reads every application.\" },\n        { key: \"g3\", icon: \"trending-up\", label: \"Rooms are organized by stage, not geography.\" }\n      ],\n      journeyGroups: groupDefs.map(g => ({\n        key: g[0], label: g[1],\n        steps: journey.filter(j => j.group === g[0]),\n        wrapStyle: { flex: g[2] + \" 1 0%\", minWidth: 0 },\n        labelStyle: {\n          font: \"var(--fw-semibold) var(--fs-xs)/1 var(--font-sans)\", letterSpacing: \".1em\",\n          textTransform: \"uppercase\", color: \"var(--gray-400)\", marginBottom: \"var(--space-4)\",\n          paddingBottom: \"var(--space-3)\", borderBottom: \"1px solid var(--border-subtle)\"\n        }\n      })),\n      navItems, details, experience, guestIncludes, memberBenefits, statusToggle,\n      isProspect: prospect,\n      statusLabel: prospect ? \"Prospect\" : \"In review\",\n      statusTone: prospect ? \"info\" : \"warning\",\n      bannerStyle: {\n        display: \"flex\", alignItems: \"flex-start\", gap: \"var(--space-4)\",\n        background: prospect ? \"var(--surface-accent)\" : \"var(--status-warning-bg)\",\n        borderBottom: \"1px solid var(--border-subtle)\",\n        padding: \"var(--space-4) var(--space-8)\"\n      },\n      bannerIconStyle: {\n        flex: \"none\", display: \"flex\", marginTop: 1,\n        color: prospect ? \"var(--action-primary)\" : \"var(--status-warning)\"\n      },\n      bannerIcon: prospect ? \"check-circle\" : \"clock\",\n      bannerTitle: prospect ? \"You're approved.\" : \"Application in review.\",\n      bannerBody: prospect\n        ? \"Schedule time with your Nexus Partner, and register for any session that fits — there's no cap.\"\n        : \"A Nexus Partner is reading it now. You'll hear back shortly.\",\n      advocateTitle: prospect ? \"Your Nexus Partner is ready\" : \"A Nexus Partner is reviewing you\",\n      advocateBody: prospect\n        ? \"Fifteen minutes. Bring the decision that's costing you sleep — that's what picks your room.\"\n        : \"They read every application personally. Once you're approved, booking opens here.\",\n      advocateCta: prospect ? \"Book 15 minutes\" : \"Booking opens
